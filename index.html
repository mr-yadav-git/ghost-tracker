<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .input-cell input::-webkit-inner-spin-button, 
        .input-cell input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .input-cell input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto">
        
        <!-- Auth Screen -->
        <div id="auth-screen" class="w-full max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl mt-16">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold tracking-wider text-emerald-400">GHOST TRACKER</h1>
                <p class="text-xs text-gray-400 mt-1">Embrace Yourself (Create / Log In)</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
                    <input type="text" id="auth-user" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="auth-pass" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-gray-950 font-semibold py-2 rounded-lg text-sm transition">Access Cloud Matrix</button>
                <p id="auth-error" class="text-xs text-center text-red-400 h-4"></p>
            </div>
        </div>

        <!-- App Screen -->
        <div id="app-screen" class="hidden space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-wider text-emerald-400">Ghost Mode</h1>
                <p class="text-xs text-gray-400 mt-1">Cloud-Synced System-Monitor Habit & Goal Tracker</p>
            </div>

            <!-- Profile Bar -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl flex justify-between items-center">
                <span class="text-sm text-gray-400">Logged in as: <strong id="display-user" class="text-emerald-400"></strong></span>
                <button onclick="handleLogout()" class="bg-red-900/40 hover:bg-red-900/70 text-red-400 border border-red-800 text-xs px-3 py-1.5 rounded-lg transition">Logout</button>
            </div>

            <!-- Global Admin Override Panel -->
            <div id="admin-section" class="bg-gray-900 border border-emerald-500/50 rounded-xl p-5 shadow-xl hidden space-y-4">
                <div class="flex flex-wrap justify-between items-center gap-3">
                    <div>
                        <h3 class="text-emerald-400 font-bold text-sm tracking-wider flex items-center gap-2">⚡ GLOBAL ADMIN USER MATRIX</h3>
                        <p class="text-xs text-gray-400 mt-1">Search users, monitor last update activity, reset passwords, or delete accounts.</p>
                    </div>
                    <input type="text" id="admin-search" placeholder="Search user..." oninput="filterAdminUsers()" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-emerald-500 w-48" />
                </div>
                <div id="users-list-container" class="mt-2 text-xs overflow-x-auto">Loading users...</div>
            </div>

            <!-- Dynamic Trackers Container -->
            <div id="trackers-container" class="space-y-6"></div>

            <!-- Add New Custom Graph Card -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-xl">
                <h3 class="text-sm font-semibold text-gray-200 mb-3">+ Add New Custom Graph</h3>
                <div class="flex flex-wrap gap-3 items-center">
                    <input type="text" id="new-title" placeholder="Tracker Name (e.g. Study Hours)" class="flex-1 min-w-[200px] bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
                    <input type="number" id="new-max" placeholder="Max Daily Target / Limit (e.g. 12)" class="w-56 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
                    <select id="new-color" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-emerald-500">
                        <option value="#34d399">Green Line</option>
                        <option value="#f87171">Red Line</option>
                        <option value="#60a5fa">Blue Line</option>
                        <option value="#fbbf24">Yellow Line</option>
                    </select>
                    <button onclick="addNewTracker()" class="bg-emerald-600 hover:bg-emerald-500 text-gray-950 font-semibold px-4 py-2 rounded-lg text-sm transition">Create Graph</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://mzscytgqzquyfkllrjbp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UNtkwhDfD5-NFwNUoLKduQ_iZiXKMl5';
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let trackers = [];
        let adminUsersCache = [];
        const MASTER_ADMIN = 'mr_yadav'; 

        async function handleLogin() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value;
            const errTag = document.getElementById('auth-error');
            errTag.innerText = '';

            if (!user || !pass) {
                errTag.innerText = 'Error: Username and password are required.';
                return;
            }

            const { data: existingUser, error: fetchError } = await client
                .from('profiles')
                .select('*')
                .eq('username', user)
                .maybeSingle();

            if (fetchError) {
                errTag.innerText = 'Database connection error. Try again.';
                return;
            }

            const nowIso = new Date().toISOString();

            if (existingUser) {
                if (existingUser.password !== pass) {
                    errTag.innerText = 'Error: Incorrect password. Username already exists.';
                    return;
                }
                trackers = existingUser.data ? JSON.parse(existingUser.data) : [];
            } else {
                trackers = [];
                const { error: insertError } = await client
                    .from('profiles')
                    .insert([{ username: user, password: pass, data: JSON.stringify(trackers), last_updated: nowIso }]);
                
                if (insertError) {
                    errTag.innerText = 'Error creating user in cloud database.';
                    return;
                }
            }

            currentUser = user;
            document.getElementById('display-user').innerText = currentUser;
            
            if (currentUser === MASTER_ADMIN) {
                document.getElementById('admin-section').classList.remove('hidden');
                renderAdminPanel();
            } else {
                document.getElementById('admin-section').classList.add('hidden');
            }

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            render();
        }

        async function renderAdminPanel() {
            const container = document.getElementById('users-list-container');
            const { data: users, error } = await client.from('profiles').select('username, password, last_updated');
            
            if (error) {
                container.innerHTML = 'Error loading users from cloud.';
                return;
            }
            
            adminUsersCache = users || [];
            displayAdminTable(adminUsersCache);
        }

        function filterAdminUsers() {
            const query = document.getElementById('admin-search').value.toLowerCase();
            const filtered = adminUsersCache.filter(u => u.username.toLowerCase().includes(query));
            displayAdminTable(filtered);
        }

        function formatTimeAgo(isoString) {
            if (!isoString) return 'Never';
            const diffMs = Date.now() - new Date(isoString).getTime();
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
        }

        function displayAdminTable(users) {
            const container = document.getElementById('users-list-container');
            if (!users || users.length === 0) {
                container.innerHTML = '<p class="text-gray-500 py-2">No users found.</p>';
                return;
            }

            let html = '<table class="w-full border-collapse text-left">';
            html += '<tr class="border-b border-gray-800 text-gray-400"><th class="py-2 px-3">Username</th><th class="py-2 px-3">Password</th><th class="py-2 px-3">Last Updated</th><th class="py-2 px-3">Actions</th></tr>';
            
            users.forEach(u => {
                const timeAgo = formatTimeAgo(u.last_updated);
                html += `<tr class="border-b border-gray-800/50 hover:bg-gray-950/40">
                    <td class="py-2.5 px-3 text-emerald-400 font-medium">${u.username}</td>
                    <td class="py-2.5 px-3 text-gray-400">${u.password}</td>
                    <td class="py-2.5 px-3 text-gray-400">${timeAgo}</td>
                    <td class="py-2.5 px-3 flex gap-2">
                        <button onclick="adminResetPassword('${u.username}')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-1 rounded text-xs transition">Reset Pass</button>
                        ${u.username !== MASTER_ADMIN ? `<button onclick="adminDeleteAccount('${u.username}')" class="bg-red-900/40 hover:bg-red-900/70 text-red-400 border border-red-800 px-2 py-1 rounded text-xs transition">Delete</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        async function adminResetPassword(targetUser) {
            let newPass = prompt(`Enter new temporary password for user "${targetUser}":`);
            if (!newPass) return;

            const { error } = await client
                .from('profiles')
                .update({ password: newPass })
                .eq('username', targetUser);

            if (!error) {
                alert(`Password for "${targetUser}" successfully updated.`);
                renderAdminPanel();
            } else {
                alert('Failed to update password.');
            }
        }

        async function adminDeleteAccount(targetUser) {
            let adminPassInput = prompt(`SECURITY 2FA: To delete account "${targetUser}", please enter your Admin Password (${MASTER_ADMIN}):`);
            if (!adminPassInput) return;

            const { data: adminData } = await client.from('profiles').select('password').eq('username', MASTER_ADMIN).single();
            if (!adminData || adminData.password !== adminPassInput) {
                alert('Authentication Failed: Incorrect admin password. Account deletion aborted.');
                return;
            }

            if (confirm(`Are you absolutely sure you want to completely erase user "${targetUser}" from the cloud?`)) {
                const { error } = await client.from('profiles').delete().eq('username', targetUser);
                if (!error) {
                    alert(`Account "${targetUser}" has been permanently deleted from the database.`);
                    renderAdminPanel();
                } else {
                    alert('Deletion failed.');
                }
            }
        }

        function handleLogout() {
            currentUser = null;
            trackers = [];
            adminUsersCache = [];
            document.getElementById('auth-user').value = '';
            document.getElementById('auth-pass').value = '';
            document.getElementById('auth-error').innerText = '';
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        async function saveAndCloudSync() {
            const nowIso = new Date().toISOString();
            await client
                .from('profiles')
                .update({ 
                    data: JSON.stringify(trackers),
                    last_updated: nowIso 
                })
                .eq('username', currentUser);
            render();
            if (currentUser === MASTER_ADMIN) {
                renderAdminPanel();
            }
        }

        function updateValue(id, dayIndex, val) {
            const tracker = trackers.find(t => t.id === id);
            tracker.data[dayIndex] = parseFloat(val) || 0;
            saveAndCloudSync();
        }

        function switchTrackerTab(id, tabName) {
            const tracker = trackers.find(t => t.id === id);
            if (!tracker) return;
            tracker.activeTab = tabName;
            render();
        }

        function render() {
            const container = document.getElementById('trackers-container');
            container.innerHTML = '';

            if(trackers.length === 0) {
                container.innerHTML = `<div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center text-gray-500 text-sm">No graphs created yet. Use the builder below to add your first graph!</div>`;
                return;
            }

            trackers.forEach(t => {
                if (!t.activeTab) t.activeTab = 'graph';

                const card = document.createElement('div');
                card.className = 'bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-xl space-y-4';
                
                let inputsHtml = '';
                for(let i = 0; i < 30; i++) {
                    inputsHtml += `
                        <div class="flex flex-col items-center text-[10px] text-gray-500">
                            <span class="mb-1">${i+1}</span>
                            <input type="number" value="${t.data[i]}" onchange="updateValue('${t.id}', ${i}, this.value)" class="w-10 bg-gray-950 border border-gray-800 text-gray-200 text-center rounded p-1 focus:outline-none focus:border-emerald-500 font-mono text-xs" />
                        </div>
                    `;
                }

                // Calculate Stats & History
                const totalVal = t.data.reduce((a, b) => a + b, 0);
                const maxPossible = t.max * 30;
                const percentage = maxPossible > 0 ? Math.min(100, Math.round((totalVal / maxPossible) * 100)) : 0;
                const activeDays = t.data.filter(v => v > 0).length;
                const consistency = Math.round((activeDays / 30) * 100);

                // Split into two 15-day periods for MoM / period comparison difference
                const firstHalf = t.data.slice(0, 15).reduce((a, b) => a + b, 0);
                const secondHalf = t.data.slice(15, 30).reduce((a, b) => a + b, 0);
                const diff = secondHalf - firstHalf;
                const diffText = diff >= 0 ? `+${diff}` : `${diff}`;

                card.innerHTML = `
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <div class="flex items-center gap-3">
                            <h3 class="font-semibold text-gray-200">${t.title} <span class="text-xs text-gray-500 font-normal">(Max Limit: ${t.max})</span></h3>
                            <div class="flex bg-gray-950 border border-gray-800 rounded-lg p-0.5 text-xs">
                                <button onclick="switchTrackerTab('${t.id}', 'graph')" class="px-3 py-1 rounded-md transition ${t.activeTab === 'graph' ? 'bg-emerald-600 text-gray-950 font-semibold' : 'text-gray-400 hover:text-gray-200'}">Tracker & Donut</button>
                                <button onclick="switchTrackerTab('${t.id}', 'history')" class="px-3 py-1 rounded-md transition ${t.activeTab === 'history' ? 'bg-emerald-600 text-gray-950 font-semibold' : 'text-gray-400 hover:text-gray-200'}">History & Stats</button>
                            </div>
                        </div>
                        <button class="bg-red-900/40 hover:bg-red-900/70 text-red-400 border border-red-800 px-3 py-1 rounded text-xs transition" onclick="deleteTracker('${t.id}', '${t.title}')">Delete Graph</button>
                    </div>

                    <div id="tab-content-${t.id}">
                        ${t.activeTab === 'graph' ? `
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                                <div class="md:col-span-3 space-y-3">
                                    <canvas id="canvas-${t.id}" class="w-full h-[140px] bg-gray-950 border border-gray-800 rounded-lg block"></canvas>
                                    <div class="grid grid-cols-[repeat(auto-fill,minmax(45px,1fr))] gap-1.5 max-h-32 overflow-y-auto p-2 bg-gray-950 border border-gray-800 rounded-lg">${inputsHtml}</div>
                                </div>
                                <div class="flex flex-col items-center justify-center bg-gray-950 border border-gray-800 rounded-lg p-4 h-full">
                                    <span class="text-xs text-gray-400 mb-2 font-medium">Monthly Progress</span>
                                    <div class="relative w-28 h-28 flex items-center justify-center">
                                        <canvas id="donut-${t.id}" width="112" height="112" class="w-28 h-28"></canvas>
                                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                            <span class="text-sm font-bold text-emerald-400">${percentage}%</span>
                                            <span class="text-[10px] text-gray-500">Achieved</span>
                                        </div>
                                    </div>
                                    <span class="text-[11px] text-gray-400 mt-2">Total: ${totalVal} /${maxPossible}</span>
                                </div>
                            </div>
                        ` : `
                            <div class="bg-gray-950 border border-gray-800 rounded-lg p-5 space-y-4">
                                <h4 class="text-xs font-bold text-emerald-400 tracking-wider uppercase">Monthly History & Performance Analytics</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                                        <p class="text-xs text-gray-400">Consistency Score</p>
                                        <p class="text-lg font-bold text-emerald-400 mt-1">${consistency}%</p>
                                        <p class="text-[10px] text-gray-500 mt-0.5">${activeDays} active days out of 30</p>
                                    </div>
                                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                                        <p class="text-xs text-gray-400">Period Difference</p>
                                        <p class="text-lg font-bold ${diff >= 0 ? 'text-emerald-400' : 'text-red-400'} mt-1">${diffText}</p>
                                        <p class="text-[10px] text-gray-500 mt-0.5">H2 vs H1 progress change</p>
                                    </div>
                                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                                        <p class="text-xs text-gray-400">Total Monthly Output</p>
                                        <p class="text-lg font-bold text-blue-400 mt-1">${totalVal}</p>
                                        <p class="text-[10px] text-gray-500 mt-0.5">Sum of all recorded days</p>
                                    </div>
                                </div>
                                <div class="space-y-2">
                                    <p class="text-xs font-semibold text-gray-300">30-Day Recorded Values Breakdown:</p>
                                    <div class="flex flex-wrap gap-1 max-h-24 overflow-y-auto p-2 bg-gray-900 border border-gray-800 rounded text-xs font-mono text-gray-300">
                                        ${t.data.map((v, idx) => `<span class="bg-gray-950 px-2 py-1 rounded border border-gray-800">Day ${idx+1}: <strong class="text-emerald-400">${v}</strong></span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
                container.appendChild(card);
                
                if (t.activeTab === 'graph') {
                    drawGraph(t);
                    drawDonutChart(t, percentage);
                }
            });
        }

        function drawGraph(t) {
            const canvas = document.getElementById(`canvas-${t.id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 140;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 1;
            const rows = 4;
            for (let i = 0; i <= rows; i++) {
                let y = (canvas.height / rows) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
                
                ctx.fillStyle = '#6b7280';
                ctx.font = '10px monospace';
                let labelVal = Math.round(t.max - (t.max / rows) * i);
                ctx.fillText(labelVal, canvas.width - 25, y > 10 ? y - 3 : 10);
            }

            const dx = canvas.width / 29;
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            t.data.forEach((val, i) => {
                let x = i * dx;
                let clampedVal = Math.min(val, t.max);
                let y = canvas.height - (clampedVal / t.max) * canvas.height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        function drawDonutChart(t, percentage) {
            const canvas = document.getElementById(`donut-${t.id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 42;
            const holeRadius = 28;

            // Background track ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 8;
            ctx.stroke();

            // Progress arc
            const angle = (Math.min(100, percentage) / 100) * (2 * Math.PI) - (0.5 * Math.PI);
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, -0.5 * Math.PI, angle);
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 8;
            ctx.stroke();

            // Hollow center cutout (O-shape)
            ctx.beginPath();
            ctx.arc(centerX, centerY, holeRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#030712';
            ctx.fill();
        }

        function addNewTracker() {
            const titleInput = document.getElementById('new-title');
            const maxInput = document.getElementById('new-max');
            const colorInput = document.getElementById('new-color');
            
            if(!titleInput.value || !maxInput.value) {
                alert('Please fill in both the title and max daily target value.');
                return;
            }

            const newId = 'tracker_' + Date.now();
            trackers.push({
                id: newId,
                title: titleInput.value,
                color: colorInput.value,
                data: Array(30).fill(0),
                max: parseFloat(maxInput.value) || 100,
                activeTab: 'graph'
            });

            titleInput.value = '';
            maxInput.value = '';
            saveAndCloudSync();
        }

        function deleteTracker(id, title) {
            const confirmed = confirm(`Are you sure you want to delete the graph "${title}"? This cannot be undone.`);
            if (confirmed) {
                trackers = trackers.filter(t => t.id !== id);
                saveAndCloudSync();
            }
        }

        window.onresize = () => trackers.forEach(t => {
            if (t.activeTab === 'graph') {
                drawGraph(t);
                const totalVal = t.data.reduce((a, b) => a + b, 0);
                const maxPossible = t.max * 30;
                const percentage = maxPossible > 0 ? Math.min(100, Math.round((totalVal / maxPossible) * 100)) : 0;
                drawDonutChart(t, percentage);
            }
        });
    </script>
</body>
</html>
