<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Dashboard</title>
    <style>
        /* Base Reset & Dashboard Theme */
        body {
            background-color: #12141c;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Main Wrapper matching original dark dashboard look */
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 960px;
        }

        /* --- EXISTING WIDGET (Kept completely intact) --- */
        .main-card {
            background-color: #1a1c25;
            border: 1px solid #2a2e3d;
            border-radius: 16px;
            padding: 24px;
            position: relative;
            box-sizing: border-box;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .goal-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .goal-subtitle {
            font-size: 13px;
            color: #8892b0;
            font-weight: normal;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tab-pill {
            background-color: #ff5c5c;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .tab-pill-inactive {
            background-color: transparent;
            color: #8892b0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid #3d262a;
            color: #ff5c5c;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .graph-section, .progress-section {
            background-color: #14161f;
            border: 1px solid #252936;
            border-radius: 12px;
            padding: 16px;
        }

        .mock-graph {
            height: 140px;
            display: flex;
            align-items: flex-end;
            position: relative;
            border-bottom: 1px solid #252936;
        }

        .mock-line {
            stroke: #2ecc71;
            fill: none;
            stroke-width: 2;
        }

        .days-scroll-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-top: 16px;
            padding-bottom: 4px;
        }

        .day-box {
            background-color: #1a1c25;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            min-width: 44px;
            height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #8892b0;
            gap: 4px;
        }

        .day-box span {
            color: #ffffff;
            font-weight: 600;
        }

        .monthly-progress-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #252936;
            border-top-color: #2ecc71;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- NEW SECTION: Updated 5-Column Form with Clean Inputs & Colors --- */
        .add-graph-card {
            background-color: #1a1c25;
            border: 1px solid #2a2e3d;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
        }

        .section-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #8892b0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plus-icon {
            color: #ff5c5c;
            font-size: 16px;
        }

        .preset-group {
            display: flex;
            gap: 8px;
        }

        .preset-pill {
            background-color: #14161f;
            border: 1px solid #252936;
            color: #a0aec0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Remove Number Input Spinner Arrows across all browsers */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Exact 5-Column Grid Layout matching user specifications */
        .form-columns-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1.1fr 1.3fr;
            gap: 12px;
            align-items: end;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: #8892b0;
            font-weight: 600;
        }

        .input-group input, 
        .input-group select {
            background-color: #13151d;
            border: 1px solid #2f3342;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: #ff5c5c;
        }

        .create-btn {
            background-color: #ff5c5c;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
            display: block;
            margin-left: auto;
        }

        .create-btn:hover {
            background-color: #e04848;
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">

    <!-- EXISTING ELEMENT: Unchanged Pushups Goal Card -->
    <div class="main-card">
        <div class="card-header-row">
            <div class="goal-title">
                Pushups Goal <span class="goal-subtitle">(Goal: 10 / Week)</span>
            </div>
            <div class="header-actions">
                <div class="tab-pill">Habit tracker</div>
                <div class="tab-pill-inactive">History & Stats</div>
                <button class="delete-btn">Delete Graph</button>
            </div>
        </div>

        <div class="content-grid">
            <div class="graph-section">
                <div class="mock-graph">
                    <!-- Simple SVG line element simulating graph preview -->
                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 500 120">
                        <path d="M 0 120 L 120 120 L 160 80 L 200 120 L 500 120" class="mock-line" />
                    </svg>
                </div>
                <div class="days-scroll-row">
                    <div class="day-box">12<span>0</span></div>
                    <div class="day-box">13<span>0</span></div>
                    <div class="day-box">14<span>0</span></div>
                    <div class="day-box">15<span>0</span></div>
                    <div class="day-box">16<span>0</span></div>
                    <div class="day-box">17<span>0</span></div>
                    <div class="day-box">18<span>0</span></div>
                    <div class="day-box">19<span>0</span></div>
                    <div class="day-box">20<span>0</span></div>
                    <div class="day-box">21<span>0</span></div>
                    <div class="day-box">22<span>0</span></div>
                </div>
            </div>
            <div class="progress-section" style="text-align: center; display: flex; flex-direction: column; justify-content: center;">
                <div style="font-size: 12px; color: #8892b0;">Monthly Progress</div>
                <div class="monthly-progress-circle">
                    <span style="font-size: 18px; font-weight: bold; color: #fff;">1%</span>
                    <span style="font-size: 10px; color: #8892b0;">Achieved</span>
                </div>
                <div style="font-size: 12px; color: #8892b0;">Total: 2 / 300</div>
            </div>
        </div>
    </div>

    <!-- NEW ELEMENT: Updated 5-Column Add Custom Graph Form -->
    <div class="add-graph-card">
        <div class="section-header-top">
            <div class="section-header">
                <span class="plus-icon">+</span> ADD NEW CUSTOM GRAPH
            </div>
            <div class="preset-group">
                <button class="preset-pill">💪 Pushups Preset</button>
                <button class="preset-pill">📚 Study Hour Preset</button>
            </div>
        </div>

        <div class="form-columns-grid">
            <!-- Column 1: Tracker Name -->
            <div class="input-group">
                <label>1. Tracker name</label>
                <input type="text" placeholder="e.g. Pushups">
            </div>

            <!-- Column 2: Max Target (Spinners Removed) -->
            <div class="input-group">
                <label>2. Max target</label>
                <input type="number" placeholder="Limit (e.g. 50)">
            </div>

            <!-- Column 3: Goal (Spinners Removed) -->
            <div class="input-group">
                <label>3. Goal</label>
                <input type="number" placeholder="Target value">
            </div>

            <!-- Column 4: Time for Goal -->
            <div class="input-group">
                <label>4. Time for goal</label>
                <select>
                    <option>Day</option>
                    <option selected>Week</option>
                    <option>Month</option>
                </select>
            </div>

            <!-- Column 5: Graph Lines with Expanded Colors -->
            <div class="input-group">
                <label>5. Graph lines</label>
                <select>
                    <option>🟢 Emerald Green</option>
                    <option>🔵 Electric Blue</option>
                    <option>🔴 Crimson Red</option>
                    <option>🟡 Neon Yellow</option>
                    <option>🟣 Vivid Purple</option>
                    <option>🟠 Sunset Orange</option>
                    <option>🩵 Turquoise</option>
                </select>
            </div>
        </div>

        <button class="create-btn">Create</button>
    </div>

</div>

</body>
</html>
